[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-mcp"
version = "0.1.0"
description = "Shared persistent memory MCP server for MCPGateway"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0,<2.0",
    "jinja2>=3.1",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[project.scripts]
agent-memory-mcp = "agent_memory_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_memory_mcp*"]

[tool.setuptools.package-data]
agent_memory_mcp = ["templates/*.j2"]

[tool.pytest.ini_options]
# no asyncio needed — all storage functions are synchronous

[tool.ruff]
line-length = 100
target-version = "py312"
