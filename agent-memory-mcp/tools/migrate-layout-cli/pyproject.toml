[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[project]
name = "migrate-layout-cli"
version = "0.1.0"
description = "One-off migration of an agent-memory storage root to the project-first layout"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
migrate-layout = "migrate_layout.cli:main"

[tool.uv.build-backend]
module-name = "migrate_layout"
