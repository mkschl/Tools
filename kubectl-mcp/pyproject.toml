[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "kubectl-mcp"
version = "0.1.0"
description = "Generic MCP server for kubectl cluster operations"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
kubectl-mcp = "kubectl_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["kubectl_mcp*"] 
