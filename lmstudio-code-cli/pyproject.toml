[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lmstudio-code-cli"
version = "0.1.0"
description = "Terminal-based coding agent powered by LM Studio"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.56",
    "httpx>=0.27",
    "rich>=13.9",
    "prompt_toolkit>=3.0",
    "click>=8.1",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[project.scripts]
lmstudio-code-cli = "lmstudio_code_cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["lmstudio_code_cli*"]

[tool.setuptools.package-data]
lmstudio_code_cli = ["themes/*.toml"]

[tool.pytest.ini_options]
# no asyncio needed — all tools are synchronous

[tool.ruff]
line-length = 100
target-version = "py312"
