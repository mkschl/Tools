[project]
name = "macos-diag-mcp"
version = "0.1.0"
description = "MCP server for read-only diagnosis of macOS UI problems (modal hangs, wake issues, runaway logging)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27,<2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[project.scripts]
macos-diag-mcp = "macos_diag_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "macos_diag_mcp"
module-root = ""

[tool.ruff]
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PLC0415"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
