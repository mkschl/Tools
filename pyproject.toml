[project]
name = "dev-tools-editor-env"
version = "0.0.0"
description = "Shared editor/type-checking environment for the small MCP servers in this folder -- NOT a real package. Each server runs from its own isolated .venv (see its own pyproject.toml); this one exists only so VS Code/Pylance has a single interpreter that can resolve every project's imports at once."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "jinja2>=3.1",
    "structlog>=24.0",
    "openai>=1.56",
    "httpx>=0.27",
    "rich>=13.9",
    "prompt_toolkit>=3.0",
    "click>=8.1",
    "questionary>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[tool.uv]
package = false
