[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-mcp"
version = "0.1.1"
description = "MCP server exposing read/search/write access to a markdown wiki repo"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27,<2",
    "anyio>=4.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[project.scripts]
wiki-mcp = "wiki_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wiki_mcp*"]

[tool.pytest.ini_options]
# no asyncio needed — all storage functions are synchronous

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PLC0415"]
